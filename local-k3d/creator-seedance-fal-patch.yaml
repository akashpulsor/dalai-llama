spec:
  template:
    spec:
      containers:
        - name: creator-service
          env:
            - name: FAL_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secrets
                  key: fal-api-key
            - name: SEEDANCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secrets
                  key: fal-api-key
            - name: SEEDANCE_BASE_URL
              value: https://queue.fal.run
            - name: SEEDANCE_VIDEO_MODEL
              value: bytedance/seedance-2.0
            - name: SEEDANCE_VIDEO_START_PATH
              value: ""
            - name: SEEDANCE_VIDEO_POLL_PATH
              value: ""
            - name: SEEDANCE_MAX_CLIP_SECONDS
              value: "15"
            - name: SEEDANCE_FAL_RESOLUTION
              value: 720p
            - name: SEEDANCE_FAL_GENERATE_AUDIO
              value: "true"
            - name: SEEDANCE_FAL_BITRATE_MODE
              value: standard
            - name: SEEDANCE_FAL_STORE_IO
              value: "false"
