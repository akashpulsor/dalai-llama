apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: platform-ui
  namespace: front-dev
spec:
  hosts: 
    - "platform-ui.dev.localhost"
  gateways: 
    - istio-ingress/platform-ui-gateway  # ✅ Reference the gateway in istio-ingress namespace
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: platform-ui.front-dev.svc.cluster.local
            port: 
              number: 80