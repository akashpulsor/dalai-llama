apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: platform-ui
  namespace: front-dev
spec:
  hosts: [ "platform-ui.dev.localhost" ]
  gateways: [ platform-ui-gateway ]
  http:
    - route:
        - destination:
            host: platform-ui.front-dev.svc.cluster.local
            port: { number: 80 }
