apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-ui-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingress
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "platform-ui.dev.localhost"  # Should match both with and without :8080