apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-ui-gateway
  namespace: front-dev
spec:
  selector:
    istio: ingress           # ✅ updated to match actual label
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - platform-ui.dev.localhost
