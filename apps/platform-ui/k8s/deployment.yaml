apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-ui-deployment
  labels:
    app: platform-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-ui
  template:
    metadata:
      labels:
        app: platform-ui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/health"
        prometheus.io/port: "80"
    spec:
      containers:
      - name: platform-ui
        image: dalaillama/platform-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: platform-ui-config
