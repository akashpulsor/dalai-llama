server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location /dashboard {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}